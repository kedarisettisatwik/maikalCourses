apply plugin: 'com.android.application'
android {
 namespace 'com.maikal.courses'
 compileSdk 36
 defaultConfig { applicationId 'com.maikal.courses'; minSdk 26; targetSdk 36; versionCode 1; versionName '1.0.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { release { def propsFile = rootProject.file('signing/signing.properties'); if (propsFile.exists()) { def p = new Properties(); propsFile.withInputStream { p.load(it) }; storeFile rootProject.file('signing/maikal-release.keystore'); storePassword p.getProperty('storePassword'); keyAlias 'maikal'; keyPassword p.getProperty('keyPassword') } } }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}
